<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Traffic Routing Tool</title>
        <link 
            rel="stylesheet" 
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""
        />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
                integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
                crossorigin="">
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap" rel="stylesheet">
        <style>
            body{margin: 0; padding: 0;font-family: "Roboto", sans-serif; font-optical-sizing: auto; font-weight: 600; font-style: normal;}
            .info_wrapper{background-color: #b9b9b9; width: fit-content; padding: 1rem; position: absolute; right: 1rem; top: 1rem; border: 5px solid darkslategray; border-radius: 1rem;}
            h1{color: darkslategrey; font-size: 2rem; width: fit-content; margin-inline: auto;}
            h2{color: slategray; font-size: 1.5rem;width: fit-content; margin-inline: auto;}
            p{color: black; font-size: 1rem;}
            button{border: 2px solid darkslategray; border-radius: 0.5rem; height: 2rem; background-color: slategray; color: #F0F0F0}
            #map {width: 100%; height:100%; position: absolute; top: 0; z-index: -5;}
        </style>
    </head>
    <body>
        <div class="info_wrapper">
            <h1>Traffic Routing Tool</h1>
            <h2>Calculates the route from work to home <br>that takes the least amount of time</h2>
            <button class="calcButton" onclick="calcRoute()"><b>Calculate Route</b></button>
            <p id="routeBody1">Route 1 Time: </p>
            <p id="routeBody2">Route 2 Time: </p>
            <p id="routeBody3">Route 3 Time: </p>
        </div>
        <div id="map"></div>
        <script>
            var map = L.map('map').setView([45.03, -93.09], 11);
            L.tileLayer("https://api.tomtom.com/map/1/tile/basic/night/{z}/{x}/{y}.png?apiVersion=2&key=Bcyw6BNE2joR7SUwKFClwJPuYM3IDCEb",{minZoom: 0, maxZoom: 22, tileSize: 256, attribution: "&copy; TomTom"}).addTo(map);
            async function calcRoute(){
                document.getElementById("routeBody1").innerHTML = "Calculating route data...";
                const url1 = "https://api.tomtom.com/routing/1/calculateRoute/45.057384,-93.197306:45.048008,-93.111797:45.037098,-93.026229:45.004655,-92.983346/json?traffic=true&travelMode=car&routeType=fastest&routeRepresentation=polyline&key=Bcyw6BNE2joR7SUwKFClwJPuYM3IDCEb";
                const url2 = "https://api.tomtom.com/routing/1/calculateRoute/45.057384,-93.197306:45.048008,-93.111797:45.010080,-93.083227:45.004655,-92.983346/json?traffic=true&travelMode=car&routeType=fastest&routeRepresentation=polyline&key=Bcyw6BNE2joR7SUwKFClwJPuYM3IDCEb";
                const url3 = "https://api.tomtom.com/routing/1/calculateRoute/45.057384,-93.197306:45.010020,-93.184309:45.010080,-93.083227:45.004655,-92.983346/json?traffic=true&travelMode=car&routeType=fastest&routeRepresentation=polyline&key=Bcyw6BNE2joR7SUwKFClwJPuYM3IDCEb";
                try {
                    const response1 = await fetch(url1);
                    if (!response1.ok) {
                    throw new Error(`Response status: ${response1.status}`);
                    }

                    const result1 = await response1.json();
                    console.log(result1);
                    let travelTimeSeconds1 = result1.routes[0].summary.travelTimeInSeconds;
                    let travelTimeMinutes1 = (travelTimeSeconds1 / 60).toFixed(1);
                    //document.getElementById("routeBody").innerHTML = `Travel time: ${travelTimeMinutes} minutes`;
                    
                    const routePoints1 = [];

                    for (const leg of result1.routes[0].legs) {
                        for (const point of leg.points) {
                            routePoints1.push([
                                point.latitude,
                                point.longitude
                            ]);
                        }
                    }
                    document.getElementById("routeBody1").innerHTML = `Route 1 Time: ${travelTimeMinutes1}`;
                    const routeLine1 = L.polyline(routePoints1,{color: "#0077ff", weight: 6}).addTo(map);

                    document.getElementById("routeBody2").innerHTML = "Calculating route data...";
                    const response2 = await fetch(url2);
                    if (!response2.ok) {
                    throw new Error(`Response status: ${response2.status}`);
                    }

                    const result2 = await response2.json();
                    console.log(result2);
                    let travelTimeSeconds2 = result2.routes[0].summary.travelTimeInSeconds;
                    let travelTimeMinutes2 = (travelTimeSeconds2 / 60).toFixed(1);
                    //document.getElementById("routeBody").innerHTML = `Travel time: ${travelTimeMinutes} minutes`;
                    
                    const routePoints2 = [];

                    for (const leg of result2.routes[0].legs) {
                        for (const point of leg.points) {
                            routePoints2.push([
                                point.latitude,
                                point.longitude
                            ]);
                        }
                    }
                    document.getElementById("routeBody2").innerHTML = `Route 2 Time: ${travelTimeMinutes2}`;
                    const routeLine2 = L.polyline(routePoints2,{color: "#0077ff", weight: 6}).addTo(map);

                    document.getElementById("routeBody3").innerHTML = "Calculating route data...";
                    const response3 = await fetch(url3);
                    if (!response3.ok) {
                    throw new Error(`Response status: ${response3.status}`);
                    }

                    const result3 = await response3.json();
                    console.log(result3);
                    let travelTimeSeconds3 = result3.routes[0].summary.travelTimeInSeconds;
                    let travelTimeMinutes3 = (travelTimeSeconds3 / 60).toFixed(1);
                    //document.getElementById("routeBody").innerHTML = `Travel time: ${travelTimeMinutes} minutes`;
                    
                    const routePoints3 = [];

                    for (const leg of result3.routes[0].legs) {
                        for (const point of leg.points) {
                            routePoints3.push([
                                point.latitude,
                                point.longitude
                            ]);
                        }
                    }
                    document.getElementById("routeBody3").innerHTML = `Route 3 Time: ${travelTimeMinutes3}`;
                    const routeLine3 = L.polyline(routePoints3,{color: "#0077ff", weight: 6}).addTo(map);

                    colorRoutes();

                    map.fitBounds(routeLine2.getBounds());

                    function colorRoutes() {
                        const routes = [
                            {
                                time: travelTimeSeconds1,
                                line: routeLine1
                            },
                            {
                                time: travelTimeSeconds2,
                                line: routeLine2
                            },
                            {
                                time: travelTimeSeconds3,
                                line: routeLine3
                            }
                        ];

                        // Sort from shortest time to longest time
                        routes.sort((a, b) => a.time - b.time);

                        // Fastest
                        routes[0].line.setStyle({
                            color: "green"
                        });

                        // Middle
                        routes[1].line.setStyle({
                            color: "#ffcd00"
                        });

                        // Slowest
                        routes[2].line.setStyle({
                            color: "#7a0019"
                        });
                    }

                } catch (error) {
                    console.error(error.message);
                }
            }
        </script>
    </body>
</html>
